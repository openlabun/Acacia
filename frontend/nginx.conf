server {
    listen 80;

    # 1. Rutas del Frontend (React)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esto es clave para que funcione el React Router si cambias de página
        try_files $uri $uri/ /index.html;
    }

    # 2. Rutas del Backend (API)
    location /api/ {
        # proxy_pass le pasa el paquete al contenedor llamado 'backend' por el puerto 8000
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Exponemos la documentación de FastAPI (Opcional pero útil para que pruebes)
    location /docs {
        proxy_pass http://backend:8000/docs;
    }
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }
}